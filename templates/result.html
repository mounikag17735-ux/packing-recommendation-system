<!DOCTYPE html>
<html>
<head>
    <title>Recommendation Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2>Top 5 Recommended Materials</h2>

    {% for item in result %}
    <div class="card p-3 mt-3">
        <h4>{{ loop.index }}. {{ item.material_name }}</h4>
        <p><strong>Predicted Cost Score:</strong> {{ item.predicted_cost }}</p>
        <p><strong>Predicted CO₂ Score:</strong> {{ item.predicted_co2 }}</p>
        <p><strong>Explanation:</strong><br> {{ item.explanation }}</p>
    </div>
    {% endfor %}
    <a href="/dashboard" class="btn btn-info mt-3">View Dashboard</a>

    <a href="/" class="btn btn-primary mt-3">Try Another</a>

</body>
</html>
