<!DOCTYPE html>
<html>
<head>
    <title>EcoPack Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    {% if message %}
        <h4 style="color:red; text-align:center; margin-top:20px;">
            {{ message }}
        </h4>
    {% endif %}

    <h2>Business Intelligence Dashboard</h2>

    <h4>CO₂ Reduction Trends</h4>
    <img src="{{ url_for('static', filename='co2_chart.png') }}" class="img-fluid">

    <h4 class="mt-4">Cost Trends</h4>
    <img src="{{ url_for('static', filename='cost_chart.png') }}" class="img-fluid">

    <h4 class="mt-4">Material Usage Trends</h4>
    <img src="{{ url_for('static', filename='usage_chart.png') }}" class="img-fluid">

    <hr class="mt-4">

    <h4>Export Sustainability Report</h4>
    <a href="/export/excel" class="btn btn-success mt-2">Download Excel Report</a>
    <a href="/export/pdf" class="btn btn-danger mt-2">Download PDF Report</a>

        <a href="/" class="btn btn-primary mt-3">Back</a>

</body>
</html>
