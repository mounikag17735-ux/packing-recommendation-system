<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Packaging Recommendation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
        }

        button {
            background-color: #2c3e50;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a252f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:first-child {
            background-color: #d1e7dd;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Packaging Recommendation System</h2>

    <form id="recommendForm">
        <label>Eco Priority (0–1)</label>
        <input type="number" id="eco_priority" step="0.1" min="0" max="1" value="0.8">

        <label>Fragility Level</label>
        <select id="fragility_level">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <label>Industry</label>
        <select id="industry">
            <option value="electronics" selected>Electronics</option>
            <option value="cosmetics">Cosmetics</option>
            <option value="food">Food & Beverage</option>
            <option value="pharma">Pharmaceutical</option>
            <option value="logistics">Logistics</option>
            <option value="retail">Retail</option>
        </select>

        <label>Product Weight (kg)</label>
        <input type="number" id="product_weight" value="10">

        <button type="submit">Get Recommendations</button>
    </form>

    <div id="result"></div>
</div>

<script>
    const form = document.getElementById("recommendForm");
    const resultDiv = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
            eco_priority: parseFloat(document.getElementById("eco_priority").value),
            fragility_level: document.getElementById("fragility_level").value,
            industry: document.getElementById("industry").value,
            product_weight: parseFloat(document.getElementById("product_weight").value)
        };

        const response = await fetch("/recommend", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-KEY": "packaging_ai_2026_secret"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.status === "success") {
            let html = "<h3>Top 5 Recommended Materials</h3>";
            html += "<table><tr><th>Rank</th><th>Material</th><th>Cost</th><th>CO₂</th><th>Explanation</th></tr>";

            result.recommended_materials.forEach(mat => {
                html += `
                    <tr>
                        <td>${mat.rank}</td>
                        <td>${mat.material_name}</td>
                        <td>${mat.predicted_cost ?? '-'}</td>
                        <td>${mat.predicted_co2 ?? '-'}</td>
                        <td>${mat.explanation}</td>
                    </tr>
                `;
            });

            html += "</table>";
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = `<p style="color:red;">${result.message}</p>`;
        }
    });
</script>
</body>
</html>
