<!DOCTYPE html>
<html>
<head>
    <title>EcoPack AI</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f4f7f6;
        }

        h1 {
            color: #2e7d32;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 15px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        table {
            margin-top: 30px;
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #e8f5e9;
        }
    </style>
</head>

<body>

<h1>🌱 EcoPack AI</h1>
<p>AI-powered sustainable packaging recommendations</p>

<button onclick="location.href='/dashboard'">📊 View Dashboard</button>

<br><br>

<div class="card">
    <h3>Get Sustainable Packaging Recommendation</h3>

    <label>Fragility Level</label>
    <select id="fragility">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
    </select>

    <label>Product Weight (kg)</label>
    <input id="weight" type="number" value="5" min="0.1" step="0.1">

    <label>Eco Priority (0–1)</label>
    <input id="eco" type="number" value="0.7" min="0" max="1" step="0.1">

    <label>Industry Type</label>
    <select id="industry">
        <option value="food">Food & Beverage</option>
        <option value="pharmaceutical">Pharmaceuticals</option>
        <option value="electronics">Electronics</option>
        <option value="cosmetics">Cosmetics</option>
        <option value="ecommerce">E-commerce</option>
        <option value="automotive">Automotive</option>
    </select>

    <button onclick="getRecommendations()">🔍 Recommend</button>
</div>

<table id="resultTable" style="display:none">
    <thead>
        <tr>
            <th>Rank</th>
            <th>Material</th>
            <th>Cost</th>
            <th>CO₂</th>
            <th>Explanation</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
function getRecommendations() {
    fetch("/recommend", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-API-KEY": "packaging_ai_2026_secret"
        },
        body: JSON.stringify({
        eco_priority: Number(document.getElementById("eco").value),
        fragility_level: document.getElementById("fragility").value,
        product_weight: Number(document.getElementById("weight").value),
        industry: document.getElementById("industry").value
        })

    })
    .then(res => res.json())
    .then(data => {
        const table = document.getElementById("resultTable");
        const tbody = table.querySelector("tbody");
        tbody.innerHTML = "";

        data.recommended_materials.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.rank}</td>
                    <td>${item.material_name}</td>
                    <td>${item.predicted_cost}</td>
                    <td>${item.predicted_co2}</td>
                    <td>${item.explanation}</td>
                </tr>
            `;
        });

        table.style.display = "table";
    });
}
</script>

</body>
</html>
